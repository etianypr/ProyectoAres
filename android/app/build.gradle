apply plugin: 'com.android.application'

// Firma y versión de la APK (spec 015). Vienen del entorno (GitHub Actions o la
// terminal): las claves nunca entran al repositorio. Sin keystore, el build de
// release queda sin firmar y se usa el de depuración.
def keystore = System.getenv("ANDROID_KEYSTORE_PATH")
def versionApk = System.getenv("APK_VERSION") ?: "1.0.0"
def codigoApk = (System.getenv("APK_VERSION_CODE") ?: "1").toInteger()
// Clave de Google para la navegación (spec 019): del entorno, nunca del repositorio.
// Sin ella la APK compila igual y la app navega con OpenRouteService.
def claveMapsGoogle = System.getenv("MAPS_API_KEY") ?: ""

android {
    namespace = "cl.dashund.ares"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cl.dashund.ares"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codigoApk
        versionName versionApk
        manifestPlaceholders = [MAPS_API_KEY: claveMapsGoogle]
        // Solo procesadores de teléfono: el kit de Google trae también los de PC
        // (x86), ~54 MB que ningún teléfono usa.
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    compileOptions {
        // El kit de navegación de Google usa APIs de Java que Android 10 no trae (spec 019).
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release {
            if (keystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Texto de la foto de la guía y de la etiqueta, en el teléfono (spec 005).
    // Modelo latino incluido en la APK (~4 MB): funciona sin señal desde el primer uso.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Navegación de Google dentro de la APK (spec 019). Trae su propio mapa de
    // Google: no se puede sumar el Maps SDK aparte. La 8.x pide Gradle 9.
    implementation "com.google.android.libraries.navigation:navigation:7.9.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
