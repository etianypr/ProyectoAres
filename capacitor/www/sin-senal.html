<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c2410c" />
    <title>ARES — Sin señal</title>
    <!-- La APK la muestra (server.errorPath) cuando no puede cargar la app: primer
         arranque sin red, o sin una copia guardada del día (spec 015, R2). Todo va
         en línea: sin red no se puede bajar nada. -->
    <style>
      :root {
        --marca: #c2410c;
        --fondo: #fafaf9;
        --texto: #1c1917;
        --apagado: #57534e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #1c1917;
          --texto: #fafaf9;
          --apagado: #a8a29e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--fondo);
        color: var(--texto);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .icono {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: var(--marca);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: var(--apagado);
        line-height: 1.45;
      }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: var(--marca);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icono" aria-hidden="true">A</div>
      <h1>Sin señal</h1>
      <p>
        No se pudo abrir ARES. La primera vez del día hay que abrirla con señal; después
        funciona aunque se corte.
      </p>
      <button type="button" onclick="location.href='https://proyecto-ares-five.vercel.app/conductor'">
        Reintentar
      </button>
    </main>
  </body>
</html>
